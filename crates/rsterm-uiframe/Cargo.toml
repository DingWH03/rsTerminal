[package]
name = "rsterm-uiframe"
version.workspace = true
edition.workspace = true
description = "Reusable egui chrome and widgets for rsTerminal"
license.workspace = true

[dependencies]
egui = { version = "0.34", features = ["serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
rsterm-fs = { workspace = true }
rsterm-platform = { workspace = true }

[target.'cfg(all(not(target_os = "android"), not(windows)))'.dependencies]
arboard = "3"

[target.'cfg(windows)'.dependencies]
arboard = "3"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_os = "android")'.dependencies]
android_clipboard = "0.1"
