[package]
name = "rsterm-connection"
version.workspace = true
edition.workspace = true
description = "SSH, serial, BLE, and local PTY connections for rsTerminal"
license.workspace = true

[dependencies]
rsterm-platform = { workspace = true }
rsterm-remote = { workspace = true }
log = "0.4"
directories = "6"
russh = "0.60"
russh-sftp = "2.1"
serialport = "4"
tokio = { version = "1", features = ["full"] }
btleplug = "0.12"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
