# Shared platform builds: Linux / Windows / Android / Debian matrix.
name: Reusable Build

on:
  workflow_call:
    inputs:
      build_linux:
        description: Build and test Linux x64 release binary
        type: boolean
        default: true
      build_windows:
        description: Build and test Windows x64 release binary
        type: boolean
        default: true
      build_android:
        description: Build Android arm64 release APK
        type: boolean
        default: true
      build_deb:
        description: Build Debian packages for amd64/arm64/i386/armhf
        type: boolean
        default: false
      upload_artifacts:
        description: Upload build artifacts
        type: boolean
        default: true
      run_tests:
        description: Run cargo test on Linux/Windows jobs
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux x64
    if: inputs.build_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev

      - name: cargo build --release
        run: cargo build --release

      - name: cargo test
        if: inputs.run_tests
        run: cargo test --workspace

      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifacts
        with:
          name: rsTerminal-linux-x64
          path: target/release/rsTerminal
          if-no-files-found: error

  windows:
    name: Windows x64
    if: inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        run: cargo build --release

      - name: cargo test
        if: inputs.run_tests
        run: cargo test --workspace

      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifacts
        with:
          name: rsTerminal-windows-x64
          path: target/release/rsTerminal.exe
          if-no-files-found: error

  android:
    name: Android APK (arm64)
    if: inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # NDK revision may differ from your machine (e.g. 30.x locally, 27.x on CI); both work with API 34.
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build APK
        run: |
          chmod +x packaging/build-apk.sh packaging/android-env.sh
          ./packaging/build-apk.sh release

      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifacts
        with:
          name: rsTerminal-android-arm64
          path: dist/rsTerminal-android-arm64-release.apk
          if-no-files-found: error

  deb:
    name: deb ${{ matrix.deb_arch }}
    if: inputs.build_deb
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: "0"
          - deb_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            use_cross: "0"
          - deb_arch: i386
            rust_target: i686-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: "1"
          - deb_arch: armhf
            rust_target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            use_cross: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install native build dependencies
        if: matrix.use_cross == '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev

      - name: Install cross
        if: matrix.use_cross == '1'
        run: cargo install cross --locked

      - name: Install cross binutils (for cargo-deb strip)
        if: matrix.use_cross == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-linux-gnueabihf \
            binutils-i686-linux-gnu

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        env:
          USE_CROSS: ${{ matrix.use_cross }}
        run: |
          chmod +x packaging/build-deb.sh
          if [[ "${{ matrix.use_cross }}" == "1" ]]; then
            ./packaging/build-deb.sh "${{ matrix.rust_target }}" "${{ matrix.deb_arch }}" --cross
          else
            ./packaging/build-deb.sh "${{ matrix.rust_target }}" "${{ matrix.deb_arch }}"
          fi

      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifacts
        with:
          name: rsTerminal-deb-${{ matrix.deb_arch }}
          path: dist/*.deb
          if-no-files-found: error
