[workspace]
resolver = "2"
members = [
    ".",
    "crates/rsterm-terminal",
    "crates/rsterm-platform",
    "crates/rsterm-remote",
    "crates/rsterm-connection",
    "crates/rsterm-fs",
    "crates/rsterm-uiframe",
    "crates/rsterm-workspace",
    "crates/rsterm-config",
    "crates/rsterm-data",
    "crates/rsterm-session-core",
    "crates/rsterm-page-terminal",
    "crates/rsterm-page-file-manager",
    "crates/rsterm-shell",
]

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
unicode-width = "0.2"
rsterm-terminal = { path = "crates/rsterm-terminal" }
rsterm-platform = { path = "crates/rsterm-platform" }
rsterm-remote = { path = "crates/rsterm-remote" }
rsterm-connection = { path = "crates/rsterm-connection" }
rsterm-fs = { path = "crates/rsterm-fs" }
rsterm-uiframe = { path = "crates/rsterm-uiframe" }
rsterm-workspace = { path = "crates/rsterm-workspace" }
rsterm-config = { path = "crates/rsterm-config" }
rsterm-data = { path = "crates/rsterm-data" }
rsterm-session-core = { path = "crates/rsterm-session-core" }
rsterm-page-terminal = { path = "crates/rsterm-page-terminal" }
rsterm-page-file-manager = { path = "crates/rsterm-page-file-manager" }
rsterm-shell = { path = "crates/rsterm-shell" }

[package]
name = "rsTerminal"
version.workspace = true
edition.workspace = true
description = "Multi terminal emulator with SSH, serial, BLE, and dual-pane file manager"
license.workspace = true
readme = "README.md"

[lib]
name = "rsTerminal"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rsTerminal"
path = "src/main.rs"

[profile.release]
strip = "symbols"

[package.metadata.deb]
maintainer = "rsTerminal DingVero <dingvero@outlook.com>"
copyright = "2026, rsTerminal DingVero"
license-file = ["LICENSE", "4"]
extended-description = """\
rsTerminal is a desktop terminal emulator with SSH, local PTY, serial, BLE,\
and an integrated dual-pane file manager.\
"""
section = "utils"
priority = "optional"
depends = "libc6 (>= 2.31), libgcc-s1, libxcb1, libxkbcommon0, libvulkan1, libegl1, libgles2, libwayland-client0, libasound2, libfontconfig1, libfreetype6, libdbus-1-3, libx11-6, libxi6, libxrandr2, libudev1 | libudev0"
assets = [
    ["target/release/rsTerminal", "usr/bin/rsTerminal", "755"],
    ["packaging/rsTerminal.desktop", "usr/share/applications/rsTerminal.desktop", "644"],
]

[dependencies]
egui = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
unicode-width = { workspace = true }
rust-i18n = "3"
once_cell = "1"
sys-locale = "0.3"
rsterm-terminal = { workspace = true }
rsterm-platform = { workspace = true }
rsterm-remote = { workspace = true }
rsterm-connection = { workspace = true }
rsterm-fs = { workspace = true }
rsterm-uiframe = { workspace = true }
rsterm-workspace = { workspace = true }
rsterm-config = { workspace = true }
rsterm-data = { workspace = true }
rsterm-session-core = { workspace = true }
rsterm-page-terminal = { workspace = true }
rsterm-page-file-manager = { workspace = true }
rsterm-shell = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
fontdb = "0.23"
rfd = "0.15"

# Linux/macOS: wgpu (Vulkan / Metal). Windows: glow until windows crate versions unify in upstream.
[target.'cfg(all(not(target_os = "android"), not(windows)))'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "accesskit",
    "wayland",
    "x11",
] }
arboard = "3"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
    "accesskit",
] }
arboard = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
android_logger = "0.15"
android_clipboard = "0.1"
winit = { version = "0.30", features = ["android-native-activity"] }
